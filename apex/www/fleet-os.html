<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="{{ portal_theme or 'afmco' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1117" />
    <!-- Fonts are served from the app's own assets, never a font CDN: this page is
         authenticated, so a Google Fonts link leaks one third-party hit per page load.
         The vendored copies keep Google's own font-display: swap and unicode-range,
         so first paint and per-subset loading are unchanged. -->
    <link rel="stylesheet" href="/assets/apex/vendor/cairo-v31/cairo.css" />
    <link rel="stylesheet" href="/assets/apex/vendor/jetbrains-mono-v24/jetbrains-mono.css" />
    <title>{{ _("Fleet OS") }}</title>
    {%- if has_fleet_role %}
    <link rel="stylesheet" href="/assets/apex/fleet_os_portal/assets/index.css" />
    <script>
      window.csrf_token = {{ csrf_token | tojson }};
      window.fleet_caps = {{ fleet_caps | tojson }};
      window.fleet_socket = {
        site_name: {{ site_name | tojson }},
        socketio_port: {{ socketio_port }},
        enabled: {{ "true" if async_enabled else "false" }},
        dev_server: {{ dev_server or 0 }},
      };
    </script>
    {%- endif %}
  </head>
  <body>
    {%- if has_fleet_role %}
    <div id="app"></div>
    <script type="module" src="/assets/apex/fleet_os_portal/assets/index.js"></script>
    {%- else %}
    {%- set denied_title = _("Fleet dashboard") %}
    {%- set denied_audience = _("This page is for the fleet team.") %}
    {%- include "apex/templates/includes/portal_denied.html" %}
    {%- endif %}
  </body>
</html>
