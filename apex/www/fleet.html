<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1117" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>الأسطول — مركبتي وطلباتي</title>
    <link rel="stylesheet" href="/assets/apex/fleet_portal/assets/index.css" />
    <script>
      // Employee page: any logged-in user reaches here (guests are redirected in
      // fleet.py). CSRF token signs the fuel-request POST; socket vars kept for
      // the shared portal bootstrap.
      window.csrf_token = {{ csrf_token | tojson }};
      window.fleet_socket = {
        site_name: {{ site_name | tojson }},
        socketio_port: {{ socketio_port }},
        enabled: {{ "true" if async_enabled else "false" }},
        dev_server: {{ dev_server or 0 }},
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/assets/apex/fleet_portal/assets/index.js"></script>
  </body>
</html>
