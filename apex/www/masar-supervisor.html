<!DOCTYPE html>
<!-- Copyright (c) 2026, AFMCO and contributors -->
<html lang="ar" dir="rtl" data-theme="{{ portal_theme or 'afmco' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#072b1a" />
    <link rel="stylesheet" href="/assets/apex/vendor/cairo-v31/cairo.css" />
    <title>{{ _("Masar Supervisor") }}</title>
    {%- if has_supervisor_role %}
    <link rel="stylesheet" href="/assets/apex/vendor/leaflet-1.9.4/leaflet.css" />
    <script src="/assets/apex/vendor/leaflet-1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="/assets/apex/route_supervisor_portal/assets/index.css" />
    <script>
      window.csrf_token = {{ csrf_token | tojson }};
      window.apex_map_tiles = {{ map_tiles | tojson }};
      window.masar_sup_socket = {
        site_name: {{ site_name | tojson }},
        socketio_port: {{ socketio_port }},
        enabled: {{ "true" if async_enabled else "false" }},
        dev_server: {{ dev_server or 0 }},
      };
    </script>
    {%- endif %}
  </head>
  <body>
    {%- if has_supervisor_role %}
    <div id="app"></div>
    <script type="module" src="/assets/apex/route_supervisor_portal/assets/index.js"></script>
    {%- else %}
    {%- set denied_title = _("Route supervisor portal") %}
    {%- set denied_audience = _("This page is for route supervisors.") %}
    {%- include "apex/templates/includes/portal_denied.html" %}
    {%- endif %}
  </body>
</html>
