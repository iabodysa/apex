<!DOCTYPE html>
<html lang="en" data-theme="{{ portal_theme or 'afmco' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#072B1A" />
    <link rel="manifest" href="/assets/apex/worker_portal/manifest.webmanifest" />
    <!-- Montserrat is served from the app's own assets, never a font CDN: this page is
         authenticated, so a Google Fonts link leaks one third-party hit per page load,
         and the driver PWA below precaches an app shell that must still render its own
         face offline. The vendored copy keeps Google's own font-display: swap and
         unicode-range, so first paint is unchanged. -->
    <link rel="stylesheet" href="/assets/apex/vendor/montserrat-v31/montserrat.css" />
    <!-- Merged Masar portal: /driver loads the SAME built bundle as /masar
         (worker_portal). window.holder_type below makes it boot the driver screens. -->
    <link rel="stylesheet" href="/assets/apex/worker_portal/assets/index.css" />
    {%- include "apex/templates/includes/portal_accent.html" %}
    <title>Salis Driver</title>
    <script>
      window.csrf_token = {{ csrf_token | tojson }};
      // Merged Masar portal: this /driver entry boots the DRIVER screen set from the
      // shared worker_portal bundle. The raw token never appears here — it rides in the
      // httpOnly masar_dt cookie and is resolved server-side by the driver endpoints.
      window.holder_type = "Driver";
      window.portal_show_brand = {{ "true" if portal_show_brand else "false" }};
      window.portal_logo = {{ (portal_logo or '') | tojson }};
      window.portal_theme = {{ (portal_theme or 'afmco') | tojson }};
      window.driver_socket = {
        site_name: {{ site_name | tojson }},
        socketio_port: {{ socketio_port }},
        enabled: {{ "true" if async_enabled else "false" }},
        dev_server: {{ dev_server or 0 }},
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/assets/apex/worker_portal/assets/index.js"></script>
    <script>
      // Register the Salis Driver PWA service worker. The worker is served from
      // the ROOT (/driver-sw.min.js) so its scope can cover /driver — a service
      // worker only controls URLs at or under its own path. It precaches the app
      // shell (HTML + built bundle) and network-firsts the driver data API, so an
      // offline reload still boots the SPA; a new build surfaces a reload banner.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/driver-sw.min.js", { scope: "/driver" })
            .catch(function (err) {
              console.warn("Driver SW registration failed", err);
            });
        });
      }
    </script>
  </body>
</html>
