<!DOCTYPE html>
<!-- Copyright (c) 2026, afmcoltd -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00844E" />
    <link rel="manifest" href="/assets/apex/worker_portal/driver.webmanifest" />
    <link rel="icon" href="/assets/apex/images/apex-app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/apex/worker_portal/icons/driver-apple-touch-icon-180.png" />
    <link rel="stylesheet" href="/assets/apex/vendor/thmanyah-v1/thmanyah.css" />
    <link rel="stylesheet" href="/assets/apex/worker_portal/assets/index.css" />
    {%- include "apex/templates/includes/portal_accent.html" %}
    <title>{{ _("Masar") }}</title>
    <script>
      window.csrf_token = {{ csrf_token | tojson }};
      window.holder_type = "Driver";
      window.driver_has_token = {{ "true" if driver_has_token else "false" }};
      window.driver_link_dead = {{ "true" if driver_link_dead else "false" }};
      window.portal_show_brand = {{ "true" if portal_show_brand else "false" }};
      window.portal_logo = {{ (portal_logo or '') | tojson }};
      window.driver_socket = {
        site_name: {{ site_name | tojson }},
        socketio_port: {{ socketio_port }},
        enabled: {{ "true" if async_enabled else "false" }},
        dev_server: {{ dev_server or 0 }},
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/assets/apex/worker_portal/assets/index.js"></script>
  </body>
</html>
