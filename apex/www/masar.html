<!DOCTYPE html>
<!-- Copyright (c) 2026, afmcoltd -->
<html lang="ar" data-theme="{{ portal_theme or 'afmco' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00844E" />
    <link rel="manifest" href="/assets/apex/worker_portal/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/apex/worker_portal/icons/masar-icon-192.png" />
    <link rel="stylesheet" href="/assets/apex/vendor/montserrat-v31/montserrat.css" />
    <link rel="stylesheet" href="/assets/apex/vendor/cairo-v31/cairo.css" />
    <link rel="stylesheet" href="/assets/apex/vendor/thmanyah-v1/thmanyah.css" />
    <link rel="stylesheet" href="/assets/apex/worker_portal/assets/index.css" />
    {%- include "apex/templates/includes/portal_accent.html" %}
    <title>{{ _("Masar") }}</title>
    <script>
      window.csrf_token = {{ csrf_token | tojson }};
      window.holder_type = "Worker";
      window.masar_has_token = {{ "true" if masar_has_token else "false" }};
      window.portal_show_brand = {{ "true" if portal_show_brand else "false" }};
      window.portal_logo = {{ (portal_logo or '') | tojson }};
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/assets/apex/worker_portal/assets/index.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker
            .register("/masar-sw.min.js", { scope: "/masar" })
            .catch(function (err) {
              console.warn("Masar SW registration failed", err);
            });
        });
      }
    </script>
  </body>
</html>
