<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="{{ shell_meta.theme_color }}" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="canonical" href="{{ shell_meta.canonical_path }}" />
    {% if shell_meta.manifest_url %}<link rel="manifest" href="{{ shell_meta.manifest_url }}" />{% endif %}
    {% if shell_meta.apple_icon_url %}<link rel="apple-touch-icon" sizes="180x180" href="{{ shell_meta.apple_icon_url }}" />{% endif %}
    <link rel="stylesheet" href="/assets/apex/vendor/thmanyah-v1/thmanyah.css" />
    <title>{{ shell_meta.title }}</title>
    <script type="module" crossorigin src="/assets/apex/apex_portal/assets/index-DuHmZMjl.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/apex/apex_portal/assets/vue-runtime-BsASgDso.js">
    <link rel="modulepreload" crossorigin href="/assets/apex/apex_portal/assets/frappe-ui-runtime-DL0eeggd.js">
    <link rel="stylesheet" crossorigin href="/assets/apex/apex_portal/assets/frappe-ui-runtime-BTUUvaN1.css">
    <link rel="stylesheet" crossorigin href="/assets/apex/apex_portal/assets/index-BrZjZkuX.css">
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.csrf_token = {{ csrf_token | tojson }};
      window.apex_portal_shell = {{ shell_meta | tojson }};
    </script>

    <script>
      {% for key in boot %}
      window["{{ key }}"] = {{ boot[key] | tojson }};
      {% endfor %}
    </script>
  </body>

</html>
