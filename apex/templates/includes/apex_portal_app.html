<!doctype html>
<html lang="{{ shell_meta.language }}" dir="{{ shell_meta.direction }}" data-timezone="{{ shell_meta.time_zone }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="{{ shell_meta.theme_color }}" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="canonical" href="{{ shell_meta.canonical_path }}" />
    {% if shell_meta.manifest_url %}<link rel="manifest" href="{{ shell_meta.manifest_url }}" />{% endif %}
    {% if shell_meta.apple_icon_url %}<link rel="apple-touch-icon" sizes="180x180" href="{{ shell_meta.apple_icon_url }}" />{% endif %}
    <link rel="stylesheet" href="/assets/apex/vendor/thmanyah-v1/thmanyah.css" />
    <title>{{ shell_meta.title }}</title>
    {% if shell_meta.seed_color %}<style>:root:root{--c-primary:{{ shell_meta.seed_color }}}</style>{% endif %}
    <script type="module" crossorigin src="/assets/apex/apex_portal/assets/index-BfEGQGn_.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/apex/apex_portal/assets/vue-runtime-CKbQOTVh.js">
    <link rel="modulepreload" crossorigin href="/assets/apex/apex_portal/assets/frappe-ui-runtime-BnKuguYY.js">
    <link rel="stylesheet" crossorigin href="/assets/apex/apex_portal/assets/frappe-ui-runtime-BTUUvaN1.css">
    <link rel="stylesheet" crossorigin href="/assets/apex/apex_portal/assets/index-DP8KXjCM.css">
  </head>
  <body>
    <div id="app">
      <section class="apex-boot" role="status" aria-live="polite">
        <img src="/assets/apex/icons/brand/apex-mark-reverse.svg" alt="" />
        <h1>{{ _("Getting Apex ready for you…") }}</h1>
        <div class="apex-boot__track" aria-hidden="true"><span></span></div>
        <p>{{ _("A moment and everything is ready.") }}</p>
      </section>
    </div>
    <script id="apex-portal-bootstrap" type="application/json">{{ boot["apex_portal"] | tojson }}</script>
    <script id="apex-portal-shell" type="application/json">{{ shell_meta | tojson }}</script>
    <script id="apex-csrf-token" type="application/json">{{ csrf_token | tojson }}</script>
    <script id="apex-portal-messages" type="application/json">{{ portal_messages | tojson }}</script>
  </body>
</html>
