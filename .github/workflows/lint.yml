name: Lint

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned: the repo's lint contract is ruff's default rule set (pyproject
        # [tool.ruff.lint] declares no `select`). ruff 0.16 expanded its defaults, so an
        # unpinned `pip install ruff` drifts CI red on ~200 rules the repo never opted
        # into (BLE001, I001, RUF059, UP032, ISC004, SIM117, S110, ...) while 0.15.x and
        # the green baseline stay clean. Pin so CI is deterministic and matches local.
        run: pip install ruff==0.15.14

      - name: Run ruff
        # scripts/ is linted alongside the package because it holds the gates the rest of
        # this lane runs — comment_audit, check_translations, check_doctype_dates. A ruff
        # error in a gate is not a style nit: an unlinted gate that breaks takes every
        # check it guards down with it, silently. Both paths were clean at 0.15.14 when
        # scripts/ was added, so this widened the scope without moving the baseline.
        run: ruff check apex/ scripts/

      - name: Shell syntax
        # run_guards.sh is a gate too, and ruff cannot see it. These are all `#!/bin/sh`,
        # so `sh -n` (dash on the runner) is the matching parser, not `bash -n`. A parse
        # check only — not shellcheck, which would be a rule set to adopt and argue over.
        run: for f in scripts/run_guards.sh .githooks/*; do sh -n "$f" || exit 1; done

      # Both gates below are stdlib-only Python: they enforce standards the local
      # toolbox already checks, but that toolbox is not installable on a runner, so
      # without an in-repo copy the standards silently rot between manual sweeps.
      - name: Comment policy (why-not-what, no banners, no task ids)
        run: python3 scripts/comment_audit.py apex

      - name: Arabic translation coverage
        # MISSING is a hard failure: an untranslated string ships as raw English to
        # an Arabic user. STALE is judged against the recorded set in
        # apex/translations/ar.stale-baseline.txt rather than a count: the extractor
        # cannot read every live string, so zero stale is not reachable, but a count
        # only says a threshold moved — it never says which row moved it. Against the
        # set, a failure lists exactly the rows a change just stranded (normally the
        # one label it renamed), and the message spells out the re-record command.
        # No --max-stale: it defaults to zero newly stale, and a numeric knob here is
        # the first thing a red lane tempts someone to raise.
        run: |
          python3 scripts/check_translations.py \
            --package apex \
            --lang ar \
            --max-missing 0
