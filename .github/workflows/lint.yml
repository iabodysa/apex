name: Lint

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]

# Cap on ar.csv rows whose English source no longer appears in the scanned package.
# 136 sit under it today, re-audited row by row: 16 are provably live through a shape
# the extractor cannot read (a __() msgid containing ">", a description over 180
# chars, onboarding intro_text, role names, a module name, hooks/changelog dict
# values, workspace link labels the framework composes at runtime); 11 belong to
# frappe/erpnext/hrms or to a portal SPA dictionary; 9 are superseded renames whose
# successor row already exists; 100 have no live source found anywhere in the tree.
# The remaining 14 is deliberate slack. Measured single-commit churn before this gate
# existed was +1, +8 and +31, so a baseline pinned to the exact count reds this lane
# on whoever pushes the next honest label rename — a failure that reads as theirs.
# Slack absorbs a workspace-scale rename, not a module retirement. The 100 unsourced
# rows are queued for an owner decision; re-cut this number by 2026-10-01.
env:
  STALE_BASELINE: 150

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned: the repo's lint contract is ruff's default rule set (pyproject
        # [tool.ruff.lint] declares no `select`). ruff 0.16 expanded its defaults, so an
        # unpinned `pip install ruff` drifts CI red on ~200 rules the repo never opted
        # into (BLE001, I001, RUF059, UP032, ISC004, SIM117, S110, ...) while 0.15.x and
        # the green baseline stay clean. Pin so CI is deterministic and matches local.
        run: pip install ruff==0.15.14

      - name: Run ruff
        run: ruff check apex/

      # Both gates below are stdlib-only Python: they enforce standards the local
      # toolbox already checks, but that toolbox is not installable on a runner, so
      # without an in-repo copy the standards silently rot between manual sweeps.
      - name: Comment policy (why-not-what, no banners, no task ids)
        run: python3 scripts/comment_audit.py apex

      - name: Arabic translation coverage
        # MISSING is a hard failure: an untranslated string ships as raw English to
        # an Arabic user. STALE is capped at a baseline instead of zero — see the
        # note on STALE_BASELINE above for why zero is not reachable or desirable.
        run: |
          python3 scripts/check_translations.py \
            --package apex \
            --lang ar \
            --max-missing 0 \
            --max-stale "$STALE_BASELINE"
