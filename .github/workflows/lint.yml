name: Lint

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned: the repo's lint contract is ruff's default rule set (pyproject
        # [tool.ruff.lint] declares no `select`). ruff 0.16 expanded its defaults, so an
        # unpinned `pip install ruff` drifts CI red on ~200 rules the repo never opted
        # into (BLE001, I001, RUF059, UP032, ISC004, SIM117, S110, ...) while 0.15.x and
        # the green baseline stay clean. Pin so CI is deterministic and matches local.
        run: pip install ruff==0.15.14

      - name: Run ruff
        # ONE root, which is now the whole published Python tree. Handed two roots ruff
        # honours .gitignore only sometimes: on a work tree carrying a gitignored
        # apex/demo/*.py, the two-root form passed 5 of 20 runs with the cache wiped
        # before each, while either root alone passed 20 of 20. CI could never reproduce
        # it — a fresh clone holds no ignored file to find — so the coin flip landed on
        # workstations. With a single root there is no second root to pair it with.
        run: ruff check apex/

      - name: Shell syntax
        # The hooks are gates too, and ruff cannot see them. These are all `#!/bin/sh`,
        # so `sh -n` (dash on the runner) is the matching parser, not `bash -n`. A parse
        # check only — not shellcheck, which would be a rule set to adopt and argue over.
        #
        # This is the one thing this lane can still say about the hooks. WHAT they
        # enforce — the commit-metadata rule, the comment and translation audits — is
        # maintainer tooling that no longer ships, so no runner can execute it; a parse
        # error in a hook is still visible here, a rule regression behind it is not.
        run: for f in .githooks/*; do sh -n "$f" || exit 1; done
