name: Tests

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]

jobs:
  gitleaks:
    # Required secret-scanning gate. gitleaks exits non-zero when it finds a
    # leak, which fails this job and therefore the whole workflow — no push or
    # merge to apex can land a committed secret. Scans only the commits
    # introduced by THIS push/PR (the new commit range), not the full history,
    # so the gate is fast and a secret added in any new commit is still caught.
    # Known fixture false positives are allowlisted in the committed
    # .gitleaks.toml at the repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Need enough history to diff the push range (before..sha); a shallow
          # tip-only clone cannot resolve the older end of the range. PRs fetch
          # the base+head; pushes fetch a bounded window instead of all history.
          fetch-depth: 50

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for committed secrets (required)
        # Scan only the commits added by this push/PR, not the whole history.
        # gitleaks reads the allowlist from the committed .gitleaks.toml.
        #
        # Resolving WHICH range this event adds is GitHub-event logic and belongs here.
        # HOW the range is scanned used to be declared once in a shared runner that the
        # pre-push hook invoked too, so neither lane could drift onto different flags.
        # That runner is maintainer tooling and no longer ships, so this lane owns the
        # invocation outright — there is no second in-repo copy left for it to drift from.
        #
        # --redact is not optional: an unredacted finding copies the secret into a log
        # that outlives the commit it came from.
        run: |
          set -uo pipefail
          before="${{ github.event.before }}"
          base="${{ github.event.pull_request.base.sha }}"
          sha="${{ github.sha }}"
          if [ -n "${base}" ] && git rev-parse --quiet --verify "${base}^{commit}" >/dev/null 2>&1; then
            # Pull request: scan base..head.
            log_opts="${base}..${sha}"
          elif [ -n "${before}" ] && git rev-parse --quiet --verify "${before}^{commit}" >/dev/null 2>&1; then
            # Push with a known previous tip: scan before..sha.
            log_opts="${before}..${sha}"
          else
            # First push / new branch / shallow window: scan the tip commit only.
            log_opts="-1 ${sha}"
          fi
          gitleaks detect --no-banner --redact --source . --log-opts="${log_opts}"

      - name: No Arabic in commit messages (forward-only)
        run: |
          set -uo pipefail
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          if git rev-parse --quiet --verify "${before}^{commit}" >/dev/null 2>&1; then
            range="${before}..${sha}"
          else
            range="-1 ${sha}"
          fi
          hits=$(git log --no-merges --format='%H %s%n%b' $range | grep -nP '[\x{0600}-\x{06FF}]' || true)
          if [ -n "$hits" ]; then
            echo "Arabic found in commit message(s) on this push — keep subjects/bodies English:"
            echo "$hits"
            exit 1
          fi
          echo "commit messages clean (no Arabic)"

      # READ THE JOB NAME BEFORE BLAMING A TEST. This step and the ones around it are
      # metadata guards, not tests, and they run BEFORE this job's only tests (the two
      # node unit tests at the end of this job) — so a red here means those never ran,
      # not that one failed. The bench suite is in the separate `test` job below, which
      # takes no `needs:` and therefore runs in parallel and is unaffected: when this
      # job is red, "the suite passed" is neither proven nor disproven by this workflow's
      # overall status, and the `test` job has to be read on its own.
      #
      # The commit-metadata rule (no automated attribution, no private author address)
      # is no longer checked here. Its one definition is maintainer tooling that does not
      # ship, so .githooks/commit-msg and .githooks/pre-commit are now the only lanes
      # that enforce it, before the commit exists rather than after it is pushed.
      # Install them once with:  git config core.hooksPath .githooks
      - name: No internal/experimental files tracked
        run: |
          set -uo pipefail
          bad=$(git ls-files | grep -iE '(^|/)(\.claude|\.agents|archive|_staging|_todo|scratch|prompts)/|\.ipynb$|\.pptx$|\.bak$|\.old$' || true)
          if [ -n "$bad" ]; then
            echo "Internal/experimental files are tracked (keep them git-ignored, never published):"
            echo "$bad"
            exit 1
          fi
          echo "no internal/experimental files tracked"

  # The former `spa-lockfiles` matrix (one `npm ci` per portal lockfile) is gone:
  # frontend/ is a single npm workspace with one frontend/package-lock.json, and the
  # portal-bundles `bundle-guard` job already runs `npm ci` from that frozen lockfile
  # before every portal build. Ownership of that lockfile is asserted by the
  # portal-bundles `manifest-ownership` job.

  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-queue:
        image: redis:7
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-cache:
        image: redis:7
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-socketio:
        image: redis:7
        ports:
          - 12000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install bench CLI
        run: pip install frappe-bench

      - name: Create bench
        # DELIBERATELY UNPINNED — read this before adding a pin. `--frappe-branch
        # version-15` resolves to that branch's HEAD at job time, so CI runs the
        # framework the app must actually ship against. A pin would have HIDDEN A-155:
        # frappe replaced validate_order_by_and_group_by's function BLACKLIST with an
        # ALLOWLIST between 15.109.0 (the bench) and 15.116.0 (CI), and the portal's
        # `field(...)` order_by stopped being legal. Tracking HEAD caught that before a
        # user did; a pin defers the same break to production and leaves a version
        # nobody owns to move. What makes the drift safe is the next step recording the
        # resolved version: a framework-caused red is then dated on sight — diff it
        # against the last green run before suspecting the app. Pin only to reproduce a
        # specific red run, and drop the pin again in that same PR.
        run: bench init --skip-redis-config-generation --frappe-branch version-15 frappe-bench

      - name: Configure bench Redis hosts
        working-directory: frappe-bench
        run: |
          bench set-config -g redis_cache "redis://127.0.0.1:13000"
          bench set-config -g redis_queue "redis://127.0.0.1:11000"
          bench set-config -g redis_socketio "redis://127.0.0.1:12000"

      - name: Get required Frappe apps
        working-directory: frappe-bench
        run: |
          bench get-app --branch version-15 --skip-assets erpnext
          bench get-app --branch version-15 --skip-assets hrms

      - name: Record the resolved framework versions
        working-directory: frappe-bench
        # Nothing pins these three, so "which framework did this run get?" has to be
        # answerable from the run itself. Also written to the job summary, where it
        # survives log truncation and is readable without opening the job.
        run: |
          set -uo pipefail
          {
            echo "| app | version | commit | committed |"
            echo "| --- | --- | --- | --- |"
            for app in frappe erpnext hrms; do
              d="apps/$app"
              [ -d "$d" ] || continue
              printf '| %s | %s | %s | %s |\n' "$app" \
                "$(grep -m1 '^__version__' "$d/$app/__init__.py" | tr -d ' "' | cut -d= -f2)" \
                "$(git -C "$d" rev-parse --short HEAD)" \
                "$(git -C "$d" show -s --format=%cI HEAD)"
            done
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Get apex app
        working-directory: frappe-bench
        run: bench get-app --skip-assets ${{ github.workspace }}

      - name: Create test site
        working-directory: frappe-bench
        run: |
          bench new-site test.localhost --db-root-password ${{ secrets.DB_ROOT_PASSWORD }} --admin-password ${{ secrets.ADMIN_PASSWORD }} --no-mariadb-socket
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app hrms
          bench --site test.localhost install-app apex

      - name: Migrate (apply fixtures, workflows and patches)
        working-directory: frappe-bench
        run: bench --site test.localhost migrate

      # The test suite is the maintainer's, not the app's, so a clone carries none and
      # `run-tests` here would exit 0 having run nothing. This asserts what a fresh install
      # is actually supposed to produce instead: the desk tree, and no broken link in it.
      # Run through the interpreter, not `bench console`: the console is IPython and swallows a
      # non-zero exit, so the one step meant to stop a false green would itself produce one.
      - name: Assert the installed app is usable
        working-directory: frappe-bench/sites
        run: |
          ../env/bin/python - <<'PY'
          import json
          import sys

          import frappe

          frappe.init(site="test.localhost")
          frappe.connect()

          # Only the SHAPE is checked here. A link to a DocType that does not exist cannot
          # reach the database at all — Workspace Link is a Dynamic Link, so frappe raises
          # LinkValidationError on save and migrate fails first. Parentage has no such guard:
          # a workspace whose parent_page names nothing simply disappears from the sidebar.
          roots = frappe.get_all("Workspace", filters={"parent_page": "Apex"}, pluck="name")
          missing = {"Apex Core", "Salis", "Habitat", "Logistay", "My Tasks"} - set(roots)
          if missing:
              sys.exit(f"workspaces missing under the Apex root: {sorted(missing)}")

          empty = [name for name in roots
                   if not frappe.get_doc("Workspace", name).links
                   and not frappe.get_doc("Workspace", name).shortcuts]
          if empty:
              sys.exit(f"workspaces that would render blank: {sorted(empty)}")

          # The child tables above are what the sidebar needs; the `content` blocks are what
          # the PAGE renders, and they are matched to those rows by label at render time. A
          # block whose name matches no row is dropped silently, and a landing page with no
          # text block at all renders as an empty card carrying nothing but Edit and New.
          named_blocks = {
              "shortcut": ("shortcut_name", "shortcuts"),
              "card": ("card_name", "links"),
              "chart": ("chart_name", "charts"),
              "number_card": ("number_card_name", "number_cards"),
              "quick_list": ("quick_list_name", "quick_lists"),
          }

          apex = frappe.get_doc("Workspace", "Apex")
          if not [b for b in json.loads(apex.content or "[]") if b.get("type") in ("header", "paragraph")]:
              sys.exit("the Apex landing page carries no text block and would render as an empty card")

          dangling = []
          for name in ["Apex", *roots]:
              doc = frappe.get_doc("Workspace", name)
              for block in json.loads(doc.content or "[]"):
                  key, table = named_blocks.get(block.get("type"), (None, None))
                  if not key:
                      continue
                  wanted = (block.get("data") or {}).get(key)
                  if wanted not in {row.label for row in doc.get(table)}:
                      dangling.append(f"{name}/{block['type']}:{wanted}")
          if dangling:
              sys.exit(f"workspace blocks naming nothing that exists: {dangling}")

          print(f"desk tree OK: {len(roots)} workspaces under Apex, none blank")
          print(f"landing page OK: {len(json.loads(apex.content))} blocks, {len(apex.shortcuts)} portal links")
          PY
