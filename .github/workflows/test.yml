name: Tests

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]

jobs:
  gitleaks:
    # Required secret-scanning gate. gitleaks exits non-zero when it finds a
    # leak, which fails this job and therefore the whole workflow — no push or
    # merge to apex can land a committed secret. Scans only the commits
    # introduced by THIS push/PR (the new commit range), not the full history,
    # so the gate is fast and a secret added in any new commit is still caught.
    # Known fixture false positives are allowlisted in the committed
    # .gitleaks.toml at the repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Need enough history to diff the push range (before..sha); a shallow
          # tip-only clone cannot resolve the older end of the range. PRs fetch
          # the base+head; pushes fetch a bounded window instead of all history.
          fetch-depth: 50

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for committed secrets (required)
        # Scan only the commits added by this push/PR, not the whole history.
        # gitleaks reads the allowlist from the committed .gitleaks.toml.
        #
        # Resolving WHICH range this event adds is GitHub-event logic and belongs
        # here. HOW the range is scanned - the binary, the redaction, the source -
        # is a rule, and it is declared once in scripts/run_guards.sh so the
        # pre-push hook cannot come to scan with different flags than this lane.
        run: |
          set -uo pipefail
          before="${{ github.event.before }}"
          base="${{ github.event.pull_request.base.sha }}"
          sha="${{ github.sha }}"
          if [ -n "${base}" ] && git rev-parse --quiet --verify "${base}^{commit}" >/dev/null 2>&1; then
            # Pull request: scan base..head.
            log_opts="${base}..${sha}"
          elif [ -n "${before}" ] && git rev-parse --quiet --verify "${before}^{commit}" >/dev/null 2>&1; then
            # Push with a known previous tip: scan before..sha.
            log_opts="${before}..${sha}"
          else
            # First push / new branch / shallow window: scan the tip commit only.
            log_opts="-1 ${sha}"
          fi
          scripts/run_guards.sh range "${log_opts}"

      - name: No Arabic in commit messages (forward-only)
        run: |
          set -uo pipefail
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          if git rev-parse --quiet --verify "${before}^{commit}" >/dev/null 2>&1; then
            range="${before}..${sha}"
          else
            range="-1 ${sha}"
          fi
          hits=$(git log --no-merges --format='%H %s%n%b' $range | grep -nP '[\x{0600}-\x{06FF}]' || true)
          if [ -n "$hits" ]; then
            echo "Arabic found in commit message(s) on this push — keep subjects/bodies English:"
            echo "$hits"
            exit 1
          fi
          echo "commit messages clean (no Arabic)"

      # READ THE JOB NAME BEFORE BLAMING A TEST. This step and the two around it are
      # metadata guards, not tests, and they run BEFORE this job's only tests (the two
      # node unit tests at the end of this job) — so a red here means those never ran,
      # not that one failed. The bench suite is in the separate `test` job below, which
      # takes no `needs:` and therefore runs in parallel and is unaffected: when this
      # job is red, "the suite passed" is neither proven nor disproven by this workflow's
      # overall status, and the `test` job has to be read on its own.
      #
      # The rule this step enforces is NOT written here. scripts/check_commit_metadata.py
      # is its one definition, and .githooks/commit-msg and .githooks/pre-commit invoke
      # that same file to refuse a bad message or a private address before the commit
      # exists. Install them once with:  git config core.hooksPath .githooks
      # apex/tests/test_repo_gates.py fails if a second copy of the rule reappears.
      - name: No automated attribution or private commit email
        run: |
          set -uo pipefail
          before="${{ github.event.before }}"
          sha="${{ github.sha }}"
          if git rev-parse --quiet --verify "${before}^{commit}" >/dev/null 2>&1; then
            range="${before}..${sha}"
          else
            range="-1 ${sha}"
          fi
          # Deliberately unquoted: a first push is judged as the two words "-1 <sha>".
          python3 scripts/check_commit_metadata.py range ${range}

      - name: No internal/experimental files tracked
        run: |
          set -uo pipefail
          bad=$(git ls-files | grep -iE '(^|/)(\.claude|\.agents|archive|_staging|_todo|scratch|prompts)/|\.ipynb$|\.pptx$|\.bak$|\.old$' || true)
          if [ -n "$bad" ]; then
            echo "Internal/experimental files are tracked (keep them git-ignored, never published):"
            echo "$bad"
            exit 1
          fi
          echo "no internal/experimental files tracked"

      # A-108's ratchet clause named a workflow STEP. Both guards already run
      # inside `run-tests --app apex` in the `test` job, so this is fail-fast, not
      # new enforcement: they are stdlib-only AST/filesystem scans (no frappe, no
      # site), so a colocation or coverage regression reds here in seconds instead
      # of behind the whole `test` job — which measured 13.5 / 15.9 / 17.1 / 18.7 /
      # 18.8 min end to end over the last five green runs (2026-07-26, step timings
      # read from the Actions API), of which 3.6–5.1 min is spent before the suite
      # even starts, in bench init / get-app / new-site / migrate.
      #
      # WHAT THIS STEP COSTS — RE-MEASURED 2026-07-26 (A-237), because the figures
      # this comment used to carry had already been corrected in the guard's own
      # docstring and were left standing here. THE WORKSTATION WAS NOT QUIET: other
      # agents were building throughout, so every local number below is a CONTENDED
      # upper bound and carries the 1-minute load average it was taken at. The spread
      # between windows is contention, not regression.
      #
      #   this step, on the runner ........ 6 / 6 / 6 / 7 / 12s (last five green runs,
      #                                     2026-07-26; whole seconds is all the API
      #                                     reports, and the 12s is one loaded runner)
      #   this step, locally .............. 2.65–2.89s at load 1.4–2.9
      #   the same command WITHOUT the
      #     skip flag ..................... 5.63–5.80s at load 1.7–3.4
      #   the two ratchet scans alone,
      #     the standalone sweep removed .. 1.06s at load 4.9–6.0
      #   the sweep itself, 23 subprocess
      #     runs, at 8 / 16 / 24 workers .. 1.53 / 1.47 / 1.50s best-of-three,
      #                                     load 3.0–5.5
      #
      # Two things this file used to claim are now false and are corrected above. The
      # ~0.7s attributed to the two scans is gone: they measure 1.06s. And raising the
      # worker count no longer HURTS — past 8 workers the wall is flat, a shade
      # better — though it still buys too little to be worth a knob. What the sweep's
      # ~1.5s does buy is the thing A-192 exists for: proof that every documented
      # standalone command still runs, which `bench run-tests` structurally cannot
      # check because it has the real frappe loaded and never enters a fallback
      # branch. Re-measure AND re-date before editing any number here; an undated
      # figure gets re-welded to a workload it was never taken against.
      #
      # The flag is set INLINE here on purpose, and this is the only place in this
      # file it may appear. ONE claim in that sweep —
      # apex.tests.test_duplicate_and_dead_code_guard — is most of the bill: the full
      # 24-claim sweep costs 4.51–4.57s against the fast lane's ~1.5s, and that module
      # takes 4.11–4.19s run directly (2026-07-26, load 1.9–3.5) because it AST-parses
      # the whole tree several times, so the subprocess is not the cost. Skipping that
      # single probe here is what takes the step from 5.63–5.80s to 2.65–2.89s locally.
      # It is a DELAY, not a hole: the `test` job below sets no such variable, so its
      # `run-tests --app apex` still executes that claim along with every other, and so
      # does a plain local `python3 -m unittest`. Promoting this to a job- or
      # workflow-level `env:` block WOULD blind the bench job — the guard's own
      # test_only_the_fast_guards_step_sets_the_skip_flag fails if anyone tries.
      - name: Test colocation and unit-test coverage ratchets
        run: APEX_SKIP_SLOW_STANDALONE_PROBES=1 python3 -m unittest apex.tests.test_colocation_ratchet apex.tests.test_unit_test_coverage_guard

      # test_repo_gates drives scripts/check_commit_metadata.py through all three of
      # its callers - the gate directly, a real commit through .githooks, and the
      # recorded range this workflow judges - and fails if they reach different
      # verdicts or if a second copy of the rule reappears anywhere. It used to run
      # only inside `run-tests --app apex`, so a disagreement surfaced only after that
      # job's whole 13.5-18.8 min, by which time the local hook had already waved the
      # offending commit through. It is stdlib-only (no frappe, no site): 3 / 4 / 3 /
      # 4 / 4s on the runner over the last five green runs, and 3.49-3.72s locally at
      # load 2.2-3.8 (all measured 2026-07-26).
      - name: Commit metadata gate decides alike in every lane
        run: python3 -m unittest apex.tests.test_repo_gates

      # The DocType date/layout contract: field_order against fields both ways, one
      # fieldtype per start/end pair, and the opening field rendered first. Defects
      # that parse as valid JSON and only misbehave on a rendered form.
      - name: DocType date and layout contract
        run: python3 scripts/check_doctype_dates.py apex

      # Dependency-free node unit tests for the worker/Masar pure helpers.
      - name: Worker-portal phone normaliser unit test
        run: node frontend/worker/phone.test.mjs

      - name: Worker-portal QR colour unit test
        run: node frontend/worker/qrColor.test.mjs

  # The former `spa-lockfiles` matrix (one `npm ci` per portal lockfile) is gone:
  # frontend/ is a single npm workspace with one frontend/package-lock.json, and the
  # portal-bundles `bundle-guard` job already runs `npm ci` from that frozen lockfile
  # before every portal build. Ownership of that lockfile is asserted by the
  # portal-bundles `manifest-ownership` job.

  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-queue:
        image: redis:7
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-cache:
        image: redis:7
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-socketio:
        image: redis:7
        ports:
          - 12000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install bench CLI
        run: pip install frappe-bench

      - name: Create bench
        # DELIBERATELY UNPINNED — read this before adding a pin. `--frappe-branch
        # version-15` resolves to that branch's HEAD at job time, so CI runs the
        # framework the app must actually ship against. A pin would have HIDDEN A-155:
        # frappe replaced validate_order_by_and_group_by's function BLACKLIST with an
        # ALLOWLIST between 15.109.0 (the bench) and 15.116.0 (CI), and the portal's
        # `field(...)` order_by stopped being legal. Tracking HEAD caught that before a
        # user did; a pin defers the same break to production and leaves a version
        # nobody owns to move. What makes the drift safe is the next step recording the
        # resolved version: a framework-caused red is then dated on sight — diff it
        # against the last green run before suspecting the app. Pin only to reproduce a
        # specific red run, and drop the pin again in that same PR.
        run: bench init --skip-redis-config-generation --frappe-branch version-15 frappe-bench

      - name: Configure bench Redis hosts
        working-directory: frappe-bench
        run: |
          bench set-config -g redis_cache "redis://127.0.0.1:13000"
          bench set-config -g redis_queue "redis://127.0.0.1:11000"
          bench set-config -g redis_socketio "redis://127.0.0.1:12000"

      - name: Get required Frappe apps
        working-directory: frappe-bench
        run: |
          bench get-app --branch version-15 --skip-assets erpnext
          bench get-app --branch version-15 --skip-assets hrms

      - name: Record the resolved framework versions
        working-directory: frappe-bench
        # Nothing pins these three, so "which framework did this run get?" has to be
        # answerable from the run itself. Also written to the job summary, where it
        # survives log truncation and is readable without opening the job.
        run: |
          set -uo pipefail
          {
            echo "| app | version | commit | committed |"
            echo "| --- | --- | --- | --- |"
            for app in frappe erpnext hrms; do
              d="apps/$app"
              [ -d "$d" ] || continue
              printf '| %s | %s | %s | %s |\n' "$app" \
                "$(grep -m1 '^__version__' "$d/$app/__init__.py" | tr -d ' "' | cut -d= -f2)" \
                "$(git -C "$d" rev-parse --short HEAD)" \
                "$(git -C "$d" show -s --format=%cI HEAD)"
            done
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Get apex app
        working-directory: frappe-bench
        run: bench get-app --skip-assets ${{ github.workspace }}

      - name: Create test site
        working-directory: frappe-bench
        run: |
          bench new-site test.localhost --db-root-password ${{ secrets.DB_ROOT_PASSWORD }} --admin-password ${{ secrets.ADMIN_PASSWORD }} --no-mariadb-socket
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app hrms
          bench --site test.localhost install-app apex
          # The full suite creates far more than Frappe's default cap of 60 new
          # Users per 60s, which raises "Throttled" in many setUpClass blocks.
          # Write the cap as an INT directly into site_config (bench set-config
          # would store a string and break Frappe's `int > limit` comparison).
          python3 -c "import json, pathlib; p = pathlib.Path('sites/test.localhost/site_config.json'); c = json.loads(p.read_text()); c['throttle_user_limit'] = 100000; p.write_text(json.dumps(c, indent=1))"

      - name: Migrate (apply seeds, workflows and patches)
        working-directory: frappe-bench
        run: bench --site test.localhost migrate

      - name: Run portal token security tests
        working-directory: frappe-bench
        run: bench --site test.localhost run-tests --module apex.tests.test_portal_token_security

      - name: Run the full test suite
        working-directory: frappe-bench
        run: bench --site test.localhost run-tests --app apex
