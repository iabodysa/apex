name: Portal Bundles

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]

jobs:
  bundle-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the frozen frontend workspace
        working-directory: frontend
        run: npm ci
      - name: Build the unified portal
        working-directory: frontend
        run: npm run build
      - name: Reject stale generated portal output
        run: |
          set -uo pipefail
          drift=$(git status --porcelain --untracked-files=all -- \
            apex/public/apex_portal \
            apex/templates/includes/apex_portal_app.html \
            apex/www/masar-sw.min.js \
            apex/www/driver-sw.min.js)
          if [ -n "$drift" ]; then
            echo "::error::Committed unified portal output is stale."
            echo "$drift"
            exit 1
          fi

  manifest-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enforce one portal workspace and one lockfile
        run: |
          set -uo pipefail
          test "$(jq -c '.workspaces' frontend/package.json)" = '["apex_portal"]'
          test "$(git ls-files 'frontend/package-lock.json' 'frontend/*/package-lock.json' | wc -l | tr -d ' ')" = '1'
          test -f frontend/package-lock.json
          test "$(jq '[.dependencies // {}, .devDependencies // {}, .overrides // {}] | map(length) | add' frontend/apex_portal/package.json)" = '0'
          for key in dompurify echarts nanoid ws; do
            test "$(jq -r --arg key "$key" '.overrides[$key] // empty' frontend/package.json)" != ''
          done
