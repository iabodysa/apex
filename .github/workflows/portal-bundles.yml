name: Portal Bundles

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]

jobs:
  bundle-guard:
    # Staleness guard for the committed SPA bundles. Each portal's built output
    # (public/<portal>/) is shipped committed so the app installs without a Node
    # toolchain. This job rebuilds every portal from its frozen lockfile and fails
    # if the fresh output differs from what is committed — i.e. someone changed
    # portal src (or the shared vite factory / frontend_shared) without rebuilding
    # and committing the bundle. The SW portals also stamp their www/*-sw.min.js,
    # so that file is diff-checked too. Mirrors the spa-lockfiles matrix shape.
    # `dir` is the source tree (frontend/<dir>/); `portal` is the served output
    # dir name (apex/public/<portal>/) — the two diverge since the src relocated.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: fleet
            portal: fleet_portal
          - dir: worker
            portal: worker_portal
            sw: "apex/www/masar-sw.min.js apex/www/driver-sw.min.js"
          - dir: safety
            portal: safety_portal
          - dir: housing
            portal: housing_portal
          - dir: route_supervisor
            portal: route_supervisor_portal
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install from frozen lockfile
        working-directory: frontend/${{ matrix.dir }}
        run: npm ci

      - name: Build the portal bundle
        working-directory: frontend/${{ matrix.dir }}
        run: npm run build

      - name: Fail if the committed bundle is stale
        run: |
          set -uo pipefail
          if ! git diff --exit-code -- "apex/public/${{ matrix.portal }}" ${{ matrix.sw }}; then
            echo "::error::Committed bundle for ${{ matrix.portal }} is stale."
            echo "Run 'npm run build' in frontend/${{ matrix.dir }} and commit apex/public/${{ matrix.portal }}/ (and the stamped www SW, if any)."
            exit 1
          fi
          echo "${{ matrix.portal }} bundle is in sync with committed output"

  override-pins:
    # Single-source guard for the security npm `overrides` (dompurify, ws). The
    # canonical values live in frontend/frontend_shared/pins.json; npm still
    # needs the override in each package.json, so this fails if any of the five
    # portals drifts from the canonical pin set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Every portal's overrides match frontend_shared/pins.json
        run: |
          set -uo pipefail
          canon=$(jq -S '.overrides' frontend/frontend_shared/pins.json)
          fail=0
          for p in fleet worker safety housing route_supervisor; do
            got=$(jq -S '.overrides' "frontend/${p}/package.json")
            if [ "$got" != "$canon" ]; then
              echo "::error::frontend/${p}/package.json overrides differ from frontend_shared/pins.json"
              diff <(echo "$canon") <(echo "$got") || true
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "all portal overrides match the canonical pins"
          exit "$fail"

  dep-pins:
    # Single-source guard for the shared framework dep versions (vue, vue-router,
    # frappe-ui, vite, @vitejs/plugin-vue). The canonical block lives in
    # frontend/frontend_shared/pins.json (.deps); this job fails if any of the
    # five portals is missing a required dep or declares a different spec — the
    # unguarded drift surface that override-pins (which only pins security
    # overrides) never covered. optionalDeps (.optionalDeps, e.g.
    # socket.io-client) are pinned only where a portal already declares them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Every portal's shared deps match frontend_shared/pins.json
        run: |
          set -uo pipefail
          pins=frontend/frontend_shared/pins.json
          fail=0
          for p in fleet worker safety housing route_supervisor; do
            pkg="frontend/${p}/package.json"
            # Required deps: must exist (in dependencies or devDependencies) and match.
            while IFS=$'\t' read -r dep ver; do
              got=$(jq -r --arg d "$dep" '(.dependencies[$d] // .devDependencies[$d] // "MISSING")' "$pkg")
              if [ "$got" != "$ver" ]; then
                echo "::error::${pkg}: shared dep '${dep}' is '${got}', canonical (pins.json .deps) is '${ver}'"
                fail=1
              fi
            done < <(jq -r '.deps | to_entries[] | "\(.key)\t\(.value)"' "$pins")
            # Optional deps: checked only when the portal declares them.
            while IFS=$'\t' read -r dep ver; do
              got=$(jq -r --arg d "$dep" '(.dependencies[$d] // .devDependencies[$d] // "ABSENT")' "$pkg")
              if [ "$got" != "ABSENT" ] && [ "$got" != "$ver" ]; then
                echo "::error::${pkg}: optional dep '${dep}' is '${got}', canonical (pins.json .optionalDeps) is '${ver}'"
                fail=1
              fi
            done < <(jq -r '(.optionalDeps // {}) | to_entries[] | "\(.key)\t\(.value)"' "$pins")
          done
          [ "$fail" -eq 0 ] && echo "all portal shared deps match the canonical pins"
          exit "$fail"
