name: Portal Bundles

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]

jobs:
  bundle-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the frozen frontend workspace
        working-directory: frontend
        run: npm ci
      # The deploy runs this exact script: `bench build` reads the app-root package.json
      # and calls it (frappe/esbuild/esbuild.js:439-458). The portal output is not in the
      # repository, so a build that fails here is a portal that never reaches a driver.
      - name: Build the unified portal the way the deploy does
        run: npm run build

  manifest-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enforce one portal workspace and one lockfile
        run: |
          set -uo pipefail
          test "$(jq -c '.workspaces' frontend/package.json)" = '["apex_portal"]'
          test "$(git ls-files 'frontend/package-lock.json' 'frontend/*/package-lock.json' | wc -l | tr -d ' ')" = '1'
          test -f frontend/package-lock.json
          test "$(jq '[.dependencies // {}, .devDependencies // {}, .overrides // {}] | map(length) | add' frontend/apex_portal/package.json)" = '0'
          for key in dompurify echarts nanoid ws; do
            test "$(jq -r --arg key "$key" '.overrides[$key] // empty' frontend/package.json)" != ''
          done
