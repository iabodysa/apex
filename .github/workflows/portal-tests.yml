name: Portal Tests

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]

jobs:
  portal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the frontend workspace from the frozen lockfile
        working-directory: frontend
        run: npm ci

      - name: Run the frontend test suite
        working-directory: frontend
        run: npm test
