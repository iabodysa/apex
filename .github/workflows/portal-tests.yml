name: Portal Tests

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]

jobs:
  portal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the frontend workspace from the frozen lockfile
        working-directory: frontend
        run: npm ci

      # The PWA contract test reads the build's own `.vite/manifest.json` (tooling/
      # service-workers.js), which only exists after a build. Without this step the suite
      # failed with ENOENT on 10 of 60 runs — a step-order defect, never a product defect.
      - name: Build the portal so the generated manifest exists
        working-directory: frontend
        run: npm run build

      - name: Run the frontend test suite
        working-directory: frontend
        run: npm test
