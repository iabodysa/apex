name: Portal Tests

on:
  push:
    branches: [apex]
  pull_request:
    branches: [apex]
  # The served-site smoke runs on every push/PR too — it provisions its own bench
  # (see portal-smoke) in ~6 min, in parallel with the ~17 min Tests job, so it
  # costs no extra wall clock. Manual dispatch stays available and additionally
  # accepts an already-served base_url.
  workflow_dispatch:
    inputs:
      base_url:
        description: "Optional: smoke an ALREADY-served site instead of provisioning one in CI"
        required: false
        default: ""

jobs:
  shared-components:
    # Vitest for the shared portal components (@shared/components/*): IconBase, the
    # deduped LangToggle / BuildingPicker, and the icons.js geometry registry
    # invariants. Runs fully in CI (jsdom, no bench) so a change to a shared
    # component that would break a consuming portal fails here. frontend_shared is a
    # workspace of the single frontend/ npm workspace but is NOT a portal: it declares
    # no deps of its own (they live in frontend/package.json) and emits no bundle, so
    # this job cannot affect the committed portal bundles or the bundle-guard job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the frontend workspace from the frozen lockfile
        working-directory: frontend
        run: npm ci

      - name: Run shared-component vitest
        working-directory: frontend
        run: npm test -w frontend_shared

  portal-smoke:
    # Smoke-mount e2e (P-206): opens each portal shell, asserts the SPA mounts
    # (#app populated) with zero console/page errors. A green bundle build proves
    # only that the bundle compiles — this job is the RUNTIME half that proves a
    # portal actually mounts when SERVED.
    #
    # It provisions its OWN site (bench + MariaDB + Redis services, same recipe as
    # the Tests workflow) and serves it on 127.0.0.1:8000, then runs the spec
    # against it. That replaces the previous design, which required a `base_url`
    # pointing at an already-running site: a GitHub-hosted runner cannot reach a
    # bench on someone's laptop, and the two SCREENSHOT_* secrets that design
    # needed were never set — so the job was structurally undispatchable and had
    # never run once in 200+ workflow runs. The optional `base_url` input is kept
    # as an escape hatch for a genuinely reachable preview/staging URL; when it is
    # supplied every provisioning step below is skipped.
    #
    # ONE job, not a per-portal matrix: the spec already loops every portal and
    # reports each one, and a matrix would provision one whole bench per portal.
    # The session user is Administrator — an account with no driver/worker link
    # still MOUNTS each SPA (it renders the "unlinked" state), which is all a
    # mount smoke asserts.
    #
    # PUSH-ENFORCED: because the job needs nothing external any more, it is a
    # normal gate on push/PR rather than dispatch-only. It costs ~6 min of runner
    # time and hides entirely behind the ~17 min Tests job it runs beside, and it
    # is the only gate that would catch a portal that builds but does not boot.
    #
    # Locally the same spec runs on the bench:
    # `APEX_PORTAL=<p> <bench>/env/bin/python e2e/portal_smoke_spec.py`
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-queue:
        image: redis:7
        ports:
          - 11000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-cache:
        image: redis:7
        ports:
          - 13000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis-socketio:
        image: redis:7
        ports:
          - 12000:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bench CLI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        run: pip install frappe-bench

      - name: Create bench
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        # DELIBERATELY UNPINNED — the reasoning lives in full on the same step in
        # test.yml. In short: version-15 HEAD at job time is the framework the app must
        # ship against, a pin would have hidden the A-155 order_by allowlist break
        # instead of catching it, and the drift is made safe by the next step recording
        # which version a run actually resolved.
        run: bench init --skip-redis-config-generation --frappe-branch version-15 frappe-bench

      - name: Configure bench Redis hosts
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        working-directory: frappe-bench
        run: |
          bench set-config -g redis_cache "redis://127.0.0.1:13000"
          bench set-config -g redis_queue "redis://127.0.0.1:11000"
          bench set-config -g redis_socketio "redis://127.0.0.1:12000"
          # No socketio process is started for this smoke, so tell the portals the
          # realtime channel is off. Otherwise the shared realtime factory opens a
          # socket.io connection whose 404 handshake is logged as a console error
          # and the mount smoke fails on noise unrelated to mounting.
          bench set-config -g disable_async 1

      - name: Get required Frappe apps
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        working-directory: frappe-bench
        run: |
          bench get-app --branch version-15 --skip-assets erpnext
          bench get-app --branch version-15 --skip-assets hrms

      - name: Record the resolved framework versions
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        working-directory: frappe-bench
        # Nothing pins these three, so "which framework did this run get?" has to be
        # answerable from the run itself. Also written to the job summary, where it
        # survives log truncation and is readable without opening the job.
        run: |
          set -uo pipefail
          {
            echo "| app | version | commit | committed |"
            echo "| --- | --- | --- | --- |"
            for app in frappe erpnext hrms; do
              d="apps/$app"
              [ -d "$d" ] || continue
              printf '| %s | %s | %s | %s |\n' "$app" \
                "$(grep -m1 '^__version__' "$d/$app/__init__.py" | tr -d ' "' | cut -d= -f2)" \
                "$(git -C "$d" rev-parse --short HEAD)" \
                "$(git -C "$d" show -s --format=%cI HEAD)"
            done
          } | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Get apex app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        working-directory: frappe-bench
        run: bench get-app --skip-assets ${{ github.workspace }}

      - name: Create the smoke site
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        working-directory: frappe-bench
        run: |
          bench new-site test.localhost --db-root-password ${{ secrets.DB_ROOT_PASSWORD }} --admin-password ${{ secrets.ADMIN_PASSWORD }} --no-mariadb-socket
          bench --site test.localhost install-app erpnext
          bench --site test.localhost install-app hrms
          bench --site test.localhost install-app apex
          # Make a portal failure diagnosable AT ALL. On a default site a 4xx from a JSON
          # endpoint writes its traceback nowhere: handle_exception answers it from the
          # respond_as_json branch, which skips the stdout print (gated on
          # `not respond_as_json`) and skips log_error_snapshot (gated on status >= 500),
          # while allow_error_traceback defaults off so the body carries no trace either.
          # That is why A-155's HTTP 417 left an empty serve log. These two settings give
          # the trace a home: the response body, and a per-request line in sites/*/logs.
          bench --site test.localhost set-config enable_frappe_logger 1
          bench --site test.localhost execute frappe.db.set_single_value \
            --args "('System Settings', 'allow_error_traceback', 1)"

      - name: Migrate (apply seeds, workflows and patches)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        working-directory: frappe-bench
        run: bench --site test.localhost migrate

      - name: Publish the committed portal bundles under sites/assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        working-directory: frappe-bench
        run: |
          set -uo pipefail
          # The portal bundles ship committed in apex/public/<portal>/; the dev
          # server serves them from sites/assets/apex. `bench build` normally makes
          # that link, but the app was fetched with --skip-assets, so link it
          # explicitly (idempotent) and then assert one real bundle file resolves.
          # frappe.app.serve mounts /assets on sites/assets (SharedDataMiddleware).
          mkdir -p sites/assets
          ln -sfn "$PWD/apps/apex/apex/public" sites/assets/apex
          ls -l sites/assets/apex/
          test -f sites/assets/apex/fleet_portal/assets/index.js

      - name: Serve the site
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.base_url == '' }}
        working-directory: frappe-bench
        run: |
          set -uo pipefail
          # `bench serve` binds 0.0.0.0 and resolves the site from the Host header,
          # so the runner must resolve test.localhost itself for the browser.
          echo "127.0.0.1 test.localhost" | sudo tee -a /etc/hosts
          nohup bench serve --port 8000 --noreload > /tmp/bench-serve.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS -H "Host: test.localhost" http://127.0.0.1:8000/api/method/frappe.ping > /dev/null; then
              echo "site is serving after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::site did not start serving on port 8000"
          cat /tmp/bench-serve.log
          exit 1

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Smoke-mount every portal
        env:
          BASE_URL: ${{ inputs.base_url || 'http://test.localhost:8000' }}
          # Administrator on the CI-provisioned site; an external base_url can
          # instead supply its own SCREENSHOT_* repository secrets.
          SCREENSHOT_USER: ${{ secrets.SCREENSHOT_USER || 'Administrator' }}
          SCREENSHOT_PW: ${{ secrets.SCREENSHOT_PW || secrets.ADMIN_PASSWORD }}
        run: python e2e/portal_smoke_spec.py

      - name: Dump the diagnostics on failure
        if: ${{ failure() && (github.event_name != 'workflow_dispatch' || inputs.base_url == '') }}
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        # Paths are workspace-relative rather than working-directory: frappe-bench, so a
        # failure that happened BEFORE the bench existed still runs this step.
        run: |
          set -uo pipefail
          # Self-test first. `order_by=version()` is refused by the OLD function blacklist
          # and by the NEW allowlist alike, so it is the one probe that stays deterministic
          # across the drift this workflow tolerates: it must answer 417 carrying a
          # readable traceback. If it does not, the dumps below prove nothing and an empty
          # one must not be read as "no error" — that misreading is what hid A-155.
          echo "::group::probe: a deliberately invalid order_by must return a readable traceback"
          jar=$(mktemp)
          curl -sS -c "$jar" -H "Host: test.localhost" \
            --data-urlencode "usr=Administrator" --data-urlencode "pwd=${ADMIN_PASSWORD}" \
            -o /dev/null http://127.0.0.1:8000/api/method/login || true
          curl -sS -b "$jar" -H "Host: test.localhost" -H "Accept: application/json" \
            --get --data-urlencode "doctype=DocType" --data-urlencode "order_by=version()" \
            -w '\n-- probe answered HTTP %{http_code} --\n' \
            http://127.0.0.1:8000/api/method/frappe.client.get_list || true
          echo "::endgroup::"

          echo "::group::bench serve (stdout/stderr)"
          tail -n 200 /tmp/bench-serve.log || true
          echo "::endgroup::"

          # The site's own logs carry the server-side traceback; the serve log only ever
          # held werkzeug's request lines, which is why the old tail came back empty.
          for f in frappe-bench/sites/test.localhost/logs/*.log frappe-bench/logs/*.log; do
            [ -s "$f" ] || continue
            echo "::group::$f"
            tail -n 200 "$f"
            echo "::endgroup::"
          done
