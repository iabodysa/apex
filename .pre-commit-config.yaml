# DEVELOPER-OPTIONAL — nothing in this file is a gate. No workflow runs `pre-commit` and
# nothing installs it, so none of it has ever executed on this repo. Opt in locally with
# a one-off sweep that installs no hook:
#
#     pip install pre-commit && pre-commit run --all-files
#
# THE LOCAL GATE IS ./.githooks, AND IT IS THE ONLY LOCAL HOOK MECHANISM HERE:
#
#     git config core.hooksPath .githooks
#
# .githooks/commit-msg and .githooks/pre-commit mirror the CI step "No automated
# attribution or private commit email" (.github/workflows/test.yml), so a bad trailer or
# a private author email is refused before the commit exists. They are not in this file
# because the two mechanisms cannot coexist: `pre-commit install` refuses to run while
# core.hooksPath is set, so adopting pre-commit as a hook would silently disable the
# metadata gate. Prefer the relative path above to an absolute one — core.hooksPath
# resolves against the work tree root, so it keeps working in every linked worktree and
# cannot rot into the dead-directory state that disabled all local hooks on 2026-07-25.
#
# The enforced gates all live in .github/workflows/: ruff check, the comment audit and
# the Arabic-translation coverage check (lint.yml), gitleaks plus the commit-metadata
# and tracked-file checks (test.yml), the ignore_permissions baseline
# (permissions-guard.yml), the committed-bundle staleness and dependency-ownership
# checks (portal-bundles.yml), and the shared-component vitest (portal-tests.yml).
#
# Dropped 2026-07-26 — these hooks could never PASS, not merely never ran, and a hook
# that cannot pass is worse than no hook because a reviewer reads it as a standard:
#   * prettier and eslint. Neither excluded apex/public/*_portal/ — 49 committed vite
#     bundles, minified to one 91,795-char line at the widest. portal-bundles.yml
#     rebuilds those and fails on any diff against the committed output, so reformatting
#     them is permanently red; prettier and the bundle guard cannot both be satisfied.
#   * .eslintrc was deleted with the eslint hook: that hook was its only consumer, eslint
#     appears in none of the 8 package.json files, and the file was unmodified Frappe
#     boilerplate (globals for Cypress, PhotoSwipe, qz — none used here).
#   * ruff-format and the `--select=I` import sorter. They would rewrite 596 of 1062
#     tracked apex/*.py files and 183 import findings. `ruff check apex/` is green today,
#     so enforcing them buys lint nothing and costs a mass reformat — an owner call.
#
# The ruff rev below tracks lint.yml's `ruff==0.15.14` pin exactly (it was v0.8.1, which
# ran a different ruleset against the same code). If one moves, move both. There is no
# `ci:` autoupdate block for the same reason: pre-commit.ci is not enabled, and a weekly
# autoupdate would silently walk this rev off CI's pin.
exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "apex.*"
        # Committed portal bundles are excluded for the same reason prettier was: they
        # must match a fresh vite build byte for byte.
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg|apex/public/.*_portal/.*"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        name: "Run ruff linter"
