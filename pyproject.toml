[project]
name = "apex"
version = "2.1.1"
description = "Apex Habitat custom application for Frappe Framework v15."
authors = [
    { name = "AFMCO Support Services Co. Ltd", email = "afm@afmcoltd.com" }
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = []

[project.urls]
Repository = "https://github.com/iabodysa/apex"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apex*"]

[tool.pytest.ini_options]
# NOT a CI entry point — nothing in .github/workflows/ invokes pytest. The suite runs
# via `bench --site test.localhost run-tests --app apex` (test.yml). Retained because
# the tests are plain unittest.TestCase, so pytest can still COLLECT them locally for
# counting or locating tests without a site.
#
# Verified 2026-07-25 on the bench py3.11 interpreter with pytest supplied via
# PYTHONPATH: `pytest --collect-only` collects 1809 tests, but EXECUTION dies at
# frappe.exceptions.IncorrectSitePath — pytest never calls frappe.init()/connect(),
# so there is no site, no DB and no per-test transaction. Promoting pytest to a real
# entry point would need a conftest.py that bootstraps a site, and a fix for
# apex/tests/test_salis_state_flow.py, which calls get_workflow_name() at import time
# and therefore aborts collection outright (the one file excluded from the 1809).
#
# All four modules are listed: colocated test_*.py live under salis/apex_core/logistay
# too, and omitting them made a collection silently miss 58 of the 137 colocated tests.
testpaths = ["apex/tests", "apex/habitat", "apex/salis", "apex/apex_core", "apex/logistay"]
python_files = "test_*.py"
addopts = "--tb=short"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Frappe auto-generates an `if TYPE_CHECKING: ... DF.Literal[...]` block in every
# DocType controller. Treating frappe.types.DF as a typing module stops ruff from
# evaluating those option strings as runtime forward references (F821), and F722
# silences the matching forward-annotation syntax error. Both mirror the standard
# Frappe / ERPNext / HRMS ruff config.
ignore = ["F722"]
typing-modules = ["frappe.types.DF"]

# Package __init__.py files re-export their split submodules for back-compat
# (the P-179/P-180 god-file splits); those imports are unused-by-design.
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
