[project]
name = "apex"
version = "2.9.0"
description = "Apex: Frappe Framework v15 application providing the Habitat, Salis, Logistay, and Apex Core modules."
authors = [
    { name = "AFMCO Support Services Co. Ltd", email = "afm@afmcoltd.com" }
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = ["pywebpush>=2,<2.4"]

[project.urls]
Repository = "https://github.com/iabodysa/apex"

# bench reads this and nothing else to decide whether an app may be installed against the
# frappe in the bench; `get_required_frappe_version` (bench/app.py:543-556) prints a warning
# on every install when it is absent. erpnext and hrms are listed because apex imports from
# both at runtime, and the same file resolves each dependency's version through its own
# pyproject. The floors are the shipped v15 line, not the exact versions installed here —
# pinning those would refuse a patch upgrade of the framework.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
hrms = ">=15.0.0,<16.0.0"

# No pytest extra and no [tool.pytest.ini_options] on purpose: the suite runs under the
# bench, via `bench --site test.localhost run-tests --app apex` (.github/workflows/
# test.yml). 271 of the 358 test_*.py files subclass frappe's FrappeTestCase, which needs
# an initialised site and a per-test transaction, so plain pytest cannot execute them.
# Verified 2026-07-26: pytest is absent from both the system and the bench interpreter,
# and no workflow invokes it — declaring it here would advertise a runner that does not
# work. Use bench, or `bench --site test.localhost run-tests --module <dotted.path>`.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apex*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Frappe auto-generates an `if TYPE_CHECKING: ... DF.Literal[...]` block in every
# DocType controller. Treating frappe.types.DF as a typing module stops ruff from
# evaluating those option strings as runtime forward references (F821), and F722
# silences the matching forward-annotation syntax error. Both mirror the standard
# Frappe / ERPNext / HRMS ruff config.
ignore = ["F722"]
typing-modules = ["frappe.types.DF"]

# extend-select, not select: the lint contract stays ruff's default set (lint.yml pins
# 0.15.14 for exactly that reason) and this only adds to it.
# W191 replaces the hand-written mixed-indentation guard. That guard refused W191 as "a
# style vote, not a consistency check", which was true while the repo had not voted.
# .editorconfig votes: indent_style = space. Once no file may indent with a tab at all,
# no file can mix, so W191 is the stricter statement of the same invariant and it scores
# zero on the tree today. Covers apex/ only, which is the root lint.yml hands ruff, and no
# tracked .py sits outside it since setup.py was deleted (2026-08-16).
extend-select = ["W191"]

# A package __init__ re-exports its split submodules, so its imports are unused by
# design. The two E402 entries are the same shape one layer up: those submodules import
# FROM the package, so the package importing them at the top is a circular import and the
# imports sit at the foot of the file. Declared here rather than suppressed inline,
# because a config entry is read by the tool while a comment only explains it away.
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"apex/salis/api/driver_portal/__init__.py" = ["E402"]
"apex/salis/api/fleet_employee.py" = ["E402"]
