[project]
name = "apex"
version = "2.1.9"
description = "Apex: Frappe Framework v15 application providing the Habitat, Salis, Logistay, and Apex Core modules."
authors = [
    { name = "AFMCO Support Services Co. Ltd", email = "afm@afmcoltd.com" }
]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

dependencies = []

[project.urls]
Repository = "https://github.com/iabodysa/apex"

# No pytest extra and no [tool.pytest.ini_options] on purpose: the suite runs under the
# bench, via `bench --site test.localhost run-tests --app apex` (.github/workflows/
# test.yml). 271 of the 358 test_*.py files subclass frappe's FrappeTestCase, which needs
# an initialised site and a per-test transaction, so plain pytest cannot execute them.
# Verified 2026-07-26: pytest is absent from both the system and the bench interpreter,
# and no workflow invokes it — declaring it here would advertise a runner that does not
# work. Use bench, or `bench --site test.localhost run-tests --module <dotted.path>`.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apex*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Frappe auto-generates an `if TYPE_CHECKING: ... DF.Literal[...]` block in every
# DocType controller. Treating frappe.types.DF as a typing module stops ruff from
# evaluating those option strings as runtime forward references (F821), and F722
# silences the matching forward-annotation syntax error. Both mirror the standard
# Frappe / ERPNext / HRMS ruff config.
ignore = ["F722"]
typing-modules = ["frappe.types.DF"]

# Package __init__.py files re-export their split submodules for back-compat
# (the P-179/P-180 god-file splits); those imports are unused-by-design.
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
